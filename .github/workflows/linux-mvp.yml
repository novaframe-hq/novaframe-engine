name: Linux MVP

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            xdg-utils \
            desktop-file-utils \
            x11-utils \
            xvfb \
            dbus-x11 \
            rpm \
            libayatana-appindicator3-1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Rust crate
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test Rust crate
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy Rust crate
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build deb and rpm bundles
        run: npm run tauri -- build --bundles deb,rpm --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Smoke-test Linux app startup under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/novaframe-smoke-data"
          export APP_DATA="$XDG_DATA_HOME/com.novaframe.desktop.wallpaper"
          export LOG_FILE="$APP_DATA/engine-debug.log"
          rm -rf "$XDG_DATA_HOME"
          mkdir -p "$XDG_DATA_HOME"

          export NO_AT_BRIDGE=1
          export LIBGL_ALWAYS_SOFTWARE=1
          export WEBKIT_DISABLE_COMPOSITING_MODE=1

          dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" bash -euo pipefail -c '
            echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-<unset>}"
            ./src-tauri/target/release/novaframe_engine &
            app_pid=$!
            cleanup() {
              kill -TERM "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            }
            trap cleanup EXIT

            ready=0
            for i in $(seq 1 30); do
              if ! kill -0 "$app_pid" 2>/dev/null; then
                echo "::error::novaframe_engine exited prematurely at tick ${i}s"
                exit 1
              fi
              if [ -f "$LOG_FILE" ] && grep -q "\[Novaframe\] main POST-underlay:" "$LOG_FILE"; then
                echo "Engine reached POST-underlay readiness in ${i}s"
                ready=1
                break
              fi
              sleep 1
            done

            if [ "$ready" -ne 1 ]; then
              echo "::error::Engine did not reach POST-underlay within 30s"
              ps -ef | grep -E "novaframe|WebKit|Xvfb|dbus" || true
              ls -laR "$XDG_DATA_HOME" || true
              [ -f "$LOG_FILE" ] && cat "$LOG_FILE" || true
              exit 1
            fi
          '

          echo "=== engine-debug.log ==="
          cat "$LOG_FILE"
          echo "========================"

          test -f "$APP_DATA/themes/three.min.js"
          test -f "$APP_DATA/themes/breathing-gradient/manifest.json"
          test -f "$APP_DATA/themes/breathing-gradient/index.html"
          test -f "$APP_DATA/.default_theme_provisioned"

          grep -q "==== engine start v" "$LOG_FILE"
          grep -q "\[shared-runtime\] wrote three.min.js" "$LOG_FILE"
          grep -q "\[default-theme\] provisioned" "$LOG_FILE"
          grep -q "\[Novaframe\] main POST-underlay:" "$LOG_FILE"

          ! grep -q "set_desktop_underlay failed" "$LOG_FILE"
          ! grep -q "set_ignore_cursor_events failed" "$LOG_FILE"

      - name: Upload Linux installer bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust crate
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test Rust crate
        run: cargo test --manifest-path src-tauri/Cargo.toml

  regression-macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust crate
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test Rust crate
        run: cargo test --manifest-path src-tauri/Cargo.toml
